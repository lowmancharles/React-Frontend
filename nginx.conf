server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed build assets never change, so browsers can cache them forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else: serve the file if it exists, otherwise the app itself.
    # index.html is never cached so a redeploy shows up on the next refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
